<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Alex — Assistente Virtual</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Alex, início">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>ALEX</span>
        </a>
        <div class="topbar-status">
          <span id="connection-badge" class="badge"><i></i> offline</span>
          <time id="clock">--:--</time>
        </div>
      </header>

      <section class="stage" aria-labelledby="title">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>

        <div class="assistant-core">
          <div class="orb" aria-hidden="true">
            <div class="orb-ring orb-ring-one"></div>
            <div class="orb-ring orb-ring-two"></div>
            <div class="orb-surface">
              <span class="wave wave-one"></span>
              <span class="wave wave-two"></span>
              <span class="wave wave-three"></span>
              <span class="wave wave-four"></span>
              <span class="wave wave-five"></span>
            </div>
          </div>

          <p class="eyebrow">ASSISTENTE DA CASA</p>
          <h1 id="title">Alex</h1>
          <p id="status" class="status" aria-live="polite">Pronto para conversar</p>

          <div class="controls">
            <button id="connect" class="primary" type="button">
              <span class="mic-icon" aria-hidden="true"></span>
              <span>Iniciar conversa</span>
            </button>
            <button id="disconnect" class="secondary" type="button" disabled>Encerrar</button>
          </div>
        </div>

        <aside class="transcript" aria-labelledby="conversation-title">
          <div class="conversation-header">
            <div>
              <p class="panel-kicker">TEMPO REAL</p>
              <h2 id="conversation-title">Conversa</h2>
            </div>
            <div class="conversation-actions">
              <button id="clear-history" class="history-clear" type="button">Limpar</button>
              <span class="privacy-mark">neste dispositivo</span>
            </div>
          </div>
          <div id="messages" class="messages" aria-live="polite">
            <div class="placeholder">
              <span class="placeholder-line"></span>
              <p>Toque em iniciar e fale naturalmente.</p>
            </div>
          </div>
        </aside>
      </section>

      <footer class="dock">
        <div class="voice-control">
          <div class="voice-copy">
            <span class="sound-icon" aria-hidden="true"></span>
            <div>
              <label for="voice">Voz</label>
              <p id="voice-note">Preparando a voz neural masculina gratuita.</p>
            </div>
          </div>
          <div class="voice-row">
            <select id="voice" aria-describedby="voice-note">
              <option>Procurando vozes em português...</option>
            </select>
            <button id="preview-voice" class="tertiary" type="button">Ouvir voz</button>
          </div>
        </div>
        <p class="privacy">Microfone do computador · conversa contínua</p>
      </footer>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
